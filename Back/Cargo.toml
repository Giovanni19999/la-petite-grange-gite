[package]
name = "gite-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "REST API of the La Petite Grange holiday cottage website"
license = "MIT"
repository = "https://github.com/Giovanni19999/la-petite-grange-gite"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
module_name_repetitions = "allow"

[dependencies]
ammonia = "4.2.5"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "macros", "migrate", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "serde-human-readable", "macros", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
webp = { version = "0.3.1", default-features = false }
webpki-roots = "1.0.12"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["mariadb"] }
tower = { version = "0.5.3", features = ["util"] }
