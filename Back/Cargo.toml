[package]
name = "gite-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "REST API of the La Petite Grange holiday cottage website"
license = "MIT"
repository = "https://github.com/Giovanni19999/la-petite-grange-gite"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
module_name_repetitions = "allow"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "macros", "migrate", "time"] }
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
