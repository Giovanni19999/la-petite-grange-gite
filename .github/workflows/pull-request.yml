name: Pull request rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: "The subject must start with a lowercase letter and must not end with a period."

  branches:
    name: Source and target branches
    runs-on: ubuntu-latest
    steps:
      - name: Check the branching model
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              develop|hotfix/*) exit 0 ;;
              *) echo "::error::Only develop or hotfix/* branches may target main."; exit 1 ;;
            esac
          fi
          if [ "$BASE" = "develop" ]; then
            case "$HEAD" in
              feat/*|fix/*|docs/*|test/*|refactor/*|perf/*|build/*|ci/*|chore/*|hotfix/*|main) exit 0 ;;
              *) echo "::error::Branch name must start with feat/, fix/, docs/, test/, refactor/, perf/, build/, ci/, chore/ or hotfix/."; exit 1 ;;
            esac
          fi
